[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evalsift"
dynamic = ["version"]
description = "Find invalid runs and failed turns in agent evaluation logs, with honest uncertainty."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "qymmore" }]
keywords = ["llm", "agents", "evaluation", "inspect", "ai-safety", "wilson-interval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["inspect_ai>=0.3.100"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "pre-commit>=3.7", "build>=1.2"]

[project.scripts]
evalsift = "evalsift.cli:main"

[project.urls]
Homepage = "https://github.com/qymmore/evalsift"
Issues = "https://github.com/qymmore/evalsift/issues"

[tool.hatch.version]
path = "src/evalsift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:inspect_ai.*"]

[tool.coverage.run]
source = ["evalsift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["RUF001"]  # "…" and "×" in user-facing strings are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]  # compound asserts read naturally in table-driven tests
